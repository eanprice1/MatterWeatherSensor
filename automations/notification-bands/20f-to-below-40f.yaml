# Save this complete file as its OWN Google Home Script Editor automation.
# Disable the combined routine before enabling these six separate routines.
# Sets Example Thermostat - Example Room and sends a notification.
# Temperature comparisons use the reported outdoor measurement.

metadata:
  name: Outdoor 20°F to below 40°F - target Heat 71°F
  description: When Outdoor Temperature Sensor in Example Room enters 20°F to below 40°F, set Example Thermostat - Example Room to Heat at 71°F and send a notification.

automations:
  - name: Outdoor 20°F to below 40°F - target Heat 71°F
    starters:
      - type: device.state.TemperatureSetting
        device: Outdoor Temperature Sensor - Example Room
        state: thermostatTemperatureAmbient
        greaterThanOrEqualTo: 20F
        lessThan: 40F
    actions:
      - type: device.command.ThermostatSetMode
        devices: Example Thermostat - Example Room
        thermostatMode: heat
      - type: device.command.ThermostatTemperatureSetpoint
        devices: Example Thermostat - Example Room
        thermostatTemperatureSetpoint: 71F
      - type: home.command.Notification
        title: Outdoor temperature - 20°F to below 40°F
        body: "Entered the 20°F-to-below-40°F band. Target rule for Example Thermostat - Example Room: Heat at 71°F."
        members:
          - example-member@example.invalid
